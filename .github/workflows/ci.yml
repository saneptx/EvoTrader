name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      RUN_MODE: research
      DATABASE_URL: postgresql+psycopg://evotrader:evotrader@127.0.0.1:5432/evotrader
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: evotrader
          POSTGRES_PASSWORD: evotrader
          POSTGRES_DB: evotrader
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evotrader -d evotrader"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  # Runs the repository's own docker-compose.yml (not Actions service containers) as documented
  # in the README, and checks health, PostgreSQL SELECT 1 and Redis PING.
  compose-smoke:
    runs-on: ubuntu-24.04
    env:
      COMPOSE_PROJECT_NAME: evotrader-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Record compose file under test
        run: |
          git rev-parse HEAD
          sha256sum docker-compose.yml
          docker --version
          docker compose version
      - name: Start services as documented
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 180 postgres redis
      - name: Health status
        run: |
          docker compose ps
          for svc in postgres redis; do
            state=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q "$svc")")
            echo "$svc health=$state"
            test "$state" = healthy
          done
      - name: PostgreSQL SELECT 1
        run: |
          out=$(docker compose exec -T postgres psql -U evotrader -d evotrader -tAc 'SELECT 1')
          echo "SELECT 1 -> $out"
          test "$out" = 1
      - name: Redis PING
        run: |
          out=$(docker compose exec -T redis redis-cli PING)
          echo "PING -> $out"
          test "$out" = PONG
      - name: Tear down
        if: always()
        run: |
          docker compose logs --no-color --tail 50 || true
          docker compose down -v
